[package]
name = "auxbookmark"
version = "0.3.0"
edition = "2024"

[dependencies]
serde = "1.0"
serde_json = "1.0"
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
